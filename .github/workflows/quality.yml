name: GOLD AI quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Dependency integrity
        run: python -m pip check
      - name: Compile all Python
        run: python -m compileall -q app.py spx_lab.py mt5_readonly.py mt5_lab.py tests
      - name: Critical static analysis
        run: ruff check app.py spx_lab.py mt5_readonly.py mt5_lab.py tests --select E9,F63,F7,F82
      - name: Run regression and UI tests
        run: pytest -q

  windows-mt5:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install Windows and MT5 dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-mt5.txt
      - name: Check MT5 library import (no terminal connection)
        run: python -c "import MetaTrader5; print('MT5 import OK')"
      - name: Check dependency integrity
        run: python -m pip check
      - name: Test reader and virtual tracking using fake terminal
        run: python -m pytest -q tests/test_mt5_readonly.py tests/test_mt5_lab.py

