name: GOLD AI quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Dependency integrity
        run: python -m pip check
      - name: Compile all Python
        run: python -m compileall -q app.py tests
      - name: Critical static analysis
        run: ruff check app.py tests --select E9,F63,F7,F82
      - name: Run regression and UI tests
        run: pytest -q
